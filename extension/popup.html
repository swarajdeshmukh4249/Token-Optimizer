<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; width: 320px; font: 13px/1.45 -apple-system, system-ui, sans-serif; background: #16181d; color: #e8eaed; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2f333b; }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3c4043; border-radius: 22px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  input:checked + .slider { background: #1a73e8; }
  input:checked + .slider:before { transform: translateX(16px); }
  section { padding: 12px 16px; }
  .status { font-size: 12px; color: #9aa0a6; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #80868b; }
  .dot.ok { background: #5ee08a; } .dot.bad { background: #f28b82; }
  .drop { border: 1px dashed #5f6368; border-radius: 10px; padding: 14px; text-align: center; color: #9aa0a6; cursor: pointer; }
  .drop:focus { outline: 2px solid #1a73e8; }
  select { background: #202124; color: #e8eaed; border: 1px solid #3c4043; border-radius: 6px; padding: 3px 6px; }
  .big { font-size: 20px; font-weight: 650; margin-top: 10px; } .big s { color: #80868b; font-weight: 500; }
  .pct { color: #5ee08a; } .muted { color: #9aa0a6; font-size: 12px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumbs a { display: block; border: 1px solid #3c4043; border-radius: 6px; overflow: hidden; }
  .thumbs img { display: block; max-width: 136px; max-height: 90px; }
  code { background: #202124; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <h1>TokenOpt</h1>
    <label class="switch" title="Optimize pasted screenshots"><input id="enabled" type="checkbox"><span class="slider"></span></label>
  </header>
  <section>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Checking local server…</span></div>
    <p class="muted">Paste a screenshot into ChatGPT or Claude.ai. TokenOpt swaps it for the cheapest equivalent and remembers it, so the next screenshot of the same screen only sends what changed.</p>
  </section>
  <section>
    <div class="muted" style="margin-bottom:6px">Backup: optimize here, then download &nbsp;
      <select id="provider"><option value="openai">ChatGPT</option><option value="claude">Claude</option></select></div>
    <div id="drop" class="drop" tabindex="0">Click here and press ⌘V, or choose a file</div>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="result"></div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
