<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TokenOpt</title>
<style>
  :root { color-scheme: dark; --bg: #111317; --card: #181b21; --line: #2a2e36; --ink: #e8eaed; --mute: #9aa0a6;
          --dim: #6f757c; --blue: #8ab4f8; --green: #5ee08a; --red: #f28b82; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center;
           justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  h1 small { color: var(--mute); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .switch { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 12px; cursor: pointer; }
  .switch input { display: none; }
  .track { position: relative; width: 36px; height: 20px; background: #3c4043; border-radius: 20px; transition: .15s; }
  .track:before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff;
                  border-radius: 50%; transition: .15s; }
  .switch input:checked + .track { background: #1a73e8; }
  .switch input:checked + .track:before { transform: translateX(16px); }
  main { padding: 14px 16px 24px; display: grid; gap: 12px; }
  .status + .status { margin-top: -6px; }
  .status b { color: var(--ink); }
  .status { font-size: 12px; color: var(--mute); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--dim); }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); }
  code { background: #202124; padding: 1px 4px; border-radius: 4px; font-size: 11.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .label { color: var(--mute); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin-top: 8px; }
  .num { font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .num.green { color: var(--green); } .num s { color: var(--dim); font-weight: 500; font-size: 16px; }
  .sub { color: var(--mute); font-size: 12px; }
  .bar { height: 6px; border-radius: 6px; background: #2a2e36; overflow: hidden; margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .draft { border-style: dashed; color: var(--mute); }
  .draft b { color: var(--ink); }
  .entry .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--mute); }
  .tag.on { color: var(--blue); border-color: #2b4a7a; }
  .prompt { margin: 6px 0 10px; color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; word-break: break-word; }
  .prompt.empty { color: var(--dim); font-style: italic; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 3px 0; vertical-align: top; }
  td:last-child { text-align: right; }
  td.k { color: var(--mute); }
  tr.total td { border-top: 1px solid var(--line); padding-top: 7px; font-weight: 600; }
  .saved { color: var(--green); font-weight: 600; }
  s { color: var(--dim); }
  .wait { color: var(--dim); }
  .empty-state { color: var(--mute); text-align: center; padding: 28px 10px; }
  .empty-state ol { text-align: left; display: inline-block; margin: 10px 0 0; padding-left: 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; }
  button.link { all: unset; cursor: pointer; color: var(--blue); font-size: 12px; }
  button.link:hover { text-decoration: underline; }
  footer { color: var(--dim); font-size: 11.5px; padding: 0 16px 20px; }
</style>
</head>
<body>
  <header>
    <h1>TokenOpt <small id="site">token ledger</small></h1>
    <label class="switch" title="Optimize pasted screenshots">
      <span id="onoff">On</span><input id="enabled" type="checkbox"><span class="track"></span>
    </label>
  </header>
  <main>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Checking local engine…</span></div>
    <div class="status"><span id="cdot" class="dot"></span><span id="conn">Checking this tab…</span></div>
    <section class="card" id="totals"></section>
    <section class="card draft" id="draft" hidden></section>
    <div class="actions">
      <button class="link" id="reset">Treat next screenshot as a new screen</button>
      <button class="link" id="clear">Clear this tab</button>
      <button class="link" id="manual">Manual mode</button>
    </div>
    <div id="entries"></div>
  </main>
  <footer id="foot"></footer>
  <script src="sidepanel.js"></script>
</body>
</html>
